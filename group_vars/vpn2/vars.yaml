---
# ════════════════════════════════════════════════════════════════════
#  Общее для ВСЕХ серверов. То, что отличается от сервера к серверу,
#  живёт в host_vars/<имя>/vars.yaml. Секреты — в vault.yaml рядом.
#  Прочие ручки — в defaults соответствующих ролей.
# ════════════════════════════════════════════════════════════════════

# ── Что ставить на серверы ──────────────────────────────────────────
# Каждый сервис разворачивается отдельно и независимо от соседей. Здесь
# набор по умолчанию для всех серверов; отдельному серверу его можно
# переопределить в его host_vars/<имя>/vars.yaml.
#
# Выключенный сервис не просто пропускается: уже поднятый контейнер или
# служба гасятся, а порт файрвол не откроет. Открытые прежде правила ufw
# роль не удаляет — убирать руками (см. SERVER.md).
#
# Развернуть только один сервис, не трогая остальные: make deploy TAGS=xui

# Обычный VPN, веб-админка wg-easy. Нужен только адрес сервера.
wireguard_enabled: true

# Обход DPI: VLESS + Reality, панель 3x-ui. Домена не требует.
# Против белых списков операторов бесполезен — см. OPERATORS.md.
xui_enabled: true

# DNS-туннель. Единственное, что работает под белым списком оператора,
# но медленное и требует своего делегированного домена. Включать
# вместе с slipstream_domain в host_vars — см. TUNNEL.md.
slipstream_enabled: false

# Второй DNS-туннель, для операторов, которые душат поток UDP-ответов.
# Нужен свой домен и внешний IPv6 у сервера.
dnstt_enabled: false

# Свой сервер удалённого доступа. Держит три порта открытыми наружу —
# включайте, только если правда пользуетесь.
rustdesk_enabled: false

# ── Адрес сервера ───────────────────────────────────────────────────
# Берётся из inventory, отдельно дублировать не нужно.
server_ip: "{{ ansible_host }}"

# Куда складывать артефакты (ключи, сводки) на локальном ПК.
# Внутри создаётся подкаталог на каждый сервер.
artifacts_dir: "artifacts"

# ── Доступ к серверам по SSH ────────────────────────────────────────
# Ключ лежит в keys/ рядом с проектом и создаётся командой make keygen.
# В git не попадает ни приватная часть, ни публичная.
ansible_user: "root"
ssh_key_file: "keys/vpn-infra"
ansible_ssh_private_key_file: "{{ ssh_key_file }}"

# Пароль нужен ровно для первого захода на новый VPS, где ключа ещё нет: ssh всё
# равно сначала пробует ключ, пароль уходит только как fallback. Пусто, пока
# vault_ssh_password не задан, — тогда бутстрап идёт по ключу из панели хостера.
ansible_password: "{{ vault_ssh_password | default('') }}"

# Кому открыт вход под root. Читаем публичную часть прямо из файла, чтобы
# не держать её в двух местах и не забыть обновить при смене ключа.
ssh_authorized_keys:
  - "{{ lookup('ansible.builtin.file', ssh_key_file + '.pub') }}"

# Вход по паролю закрыт: сервер круглосуточно перебирают ботнеты. Роль откажется
# отключать пароль, пока на сервере нет ни одного ключа, так что запереть себя
# снаружи одной опечаткой не выйдет. Запасной путь, если ключ потеряется, —
# аварийная консоль в панели хостера.
ssh_disable_password: true

# ── Пароли админок ──────────────────────────────────────────────────
# Значения лежат в зашифрованном group_vars/all/vault.yaml. Их генерирует
# make init; посмотреть свои — make show-secrets.
wireguard_admin_password: "{{ vault_wireguard_admin_password | default('') }}"
xui_admin_password: "{{ vault_xui_admin_password | default('') }}"

# Явный relay для RustDesk: адрес того сервера, на который идёт развёртывание.
rustdesk_relay_servers: "{{ server_ip }}:{{ rustdesk_relay_port }}"
