[defaults]
inventory = inventory/hosts.yaml
roles_path = roles
# Коллекции внутри репозитория: в этом же WSL живут проекты с другими их версиями.
collections_path = ./.ansible/collections
vault_password_file = ./.vault-key
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
force_color = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
# accept-new: при первом подключении к свежему VPS ключ хоста принимается
# автоматически (и запоминается), но смена ключа позже всё равно вызовет ошибку.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new
