---
# Публичные ключи, которым разрешён вход под root. Секретом не являются —
# приватная часть остаётся на вашем ПК и в репозиторий не попадает.
ssh_authorized_keys: []

# Отключение входа по паролю. По умолчанию ВЫКЛЮЧЕНО намеренно: сначала нужно
# убедиться, что вход по ключу работает, иначе можно запереть себя снаружи.
# Порядок: развернуть с false → проверить вход по ключу → поставить true → развернуть снова.
ssh_disable_password: false

# Учётки, которых на сервере быть не должно. tunnel остался от старой схемы,
# где DNS-туннель ходил через SSH: его пароль разошёлся по мессенджерам и
# сторонним приложениям, а проброс портов через него открывал админку wg-easy.
ssh_absent_users:
  - tunnel

# Общий проброс портов не нужен: DNS-туннель ходит через собственный SOCKS.
# При false остаются только исключения из ssh_permit_open — локальный -L на
# loopback-админки; всё прочее закрыто. true снимает и это ограничение.
ssh_allow_tcp_forwarding: false

# Порты на loopback, куда разрешён -L. Наружу админки не смотрят вовсе, и это
# единственный путь к ним, поэтому список ровно по включённым сервисам:
# лишний порт здесь — лишняя дверь внутрь.
ssh_permit_open: >-
  {{ ([wireguard_admin_port] if wireguard_enabled | default(true) | bool else [])
     + ([xui_admin_port] if xui_enabled | default(false) | bool else []) }}

ssh_permit_root_login: "yes"
ssh_max_auth_tries: 3
ssh_login_grace_time: 30
ssh_allow_users: "root"
