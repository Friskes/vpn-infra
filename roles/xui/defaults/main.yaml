---
# Третий канал, рядом с WireGuard и DNS-туннелями. Нужен там, где интернет
# обычный, но провайдер душит VPN по сигнатуре протокола: WireGuard узнаётся с
# первого пакета, а VLESS+Reality притворяется обычным визитом на чужой сайт.
# Против белых списков не поможет — там фильтр смотрит на адрес назначения,
# а не на вид трафика (проверено на МТС и Мегафоне).
xui_enabled: true

# Панель 3x-ui: один контейнер, внутри Xray-core. Версию фиксируем — latest
# однажды приедет с ломающим изменением ровно в тот момент, когда канал нужен.
xui_image: "ghcr.io/mhsanaei/3x-ui:v3.6.0"
xui_container_name: "3x-ui"
xui_config_dir: "/root/.x-ui"

# Порт, на котором Xray принимает клиентов. 443/tcp выбран намеренно: трафик
# на него не выделяется на фоне обычного HTTPS.
xui_public_port: 443

# Админка публикуется только на loopback — снаружи её нет. Открытая панель с
# заводским паролем это самый частый способ, которым такие серверы угоняют.
# Вход: ssh -i keys/vpn-infra -o IdentitiesOnly=yes -L 2053:127.0.0.1:2053
# root@<сервер>, потом http://127.0.0.1:2053
xui_admin_port: 2053
xui_admin_publish: "127.0.0.1:{{ xui_admin_port }}:{{ xui_admin_port }}/tcp"

# Логин и пароль первого входа. Пароль — из vault, пустой не пропускает assert.
xui_admin_user: "admin"
xui_admin_password: ""

# Путь админки. Со случайным суффиксом её не найдёт тот, кто просто ткнётся
# в порт: даже пробившись к loopback, он получит 404 на всё, кроме этого пути.
xui_base_path: ""

# Встроенный в образ fail2ban выключен: он защищает панель, а её снаружи нет,
# зато ради него контейнеру пришлось бы выдать NET_ADMIN и NET_RAW.
# SSH стережёт отдельный fail2ban на самом сервере.
xui_enable_fail2ban: false

# Потолок памяти. На гигабайтной машине без него панель на Go разрастается на
# свободном месте, а рядом живут два DNS-туннеля, wg-easy и RustDesk.
xui_memory_limit: "256m"
