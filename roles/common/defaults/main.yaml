---
# Обновления на этом сервере ежедневно ставит unattended-upgrades, поэтому деплой их
# не дублирует: dist-upgrade посреди прогона — самая долгая и рискованная операция.
common_upgrade_packages: false
common_auto_reboot: false

# Обновления ядра применяются только после перезагрузки. Без неё сервер может
# месяцами работать на ядре с известными дырами — и никто об этом не узнает,
# потому что всё продолжает работать. Пусть перезагружается сам, ночью.
common_unattended_reboot: true
common_unattended_reboot_time: "04:30"
common_base_packages:
  - ca-certificates
  - ufw
  # Ставит обновления и перезагружает по ночам (конфиг ниже). На минимальном
  # образе пакета может не быть — без него вся схема автообновлений молчит.
  - unattended-upgrades
