---
# Временный архив на сервере: собирается, скачивается и сразу удаляется.
# Лежит в /root (0700), а не в /tmp: на сервере есть учётки proxy, slipstream и
# dnstt, под которыми работают демоны, разбирающие трафик из интернета. Архив
# с приватным ключом сервера и конфигами всех клиентов им видеть незачем.
backup_wireguard_archive: /root/wg-easy-state.tar.gz

# Имена файлов в artifacts/<сервер>/ на локальном ПК.
backup_wireguard_name: wg-easy-state.tar.gz
backup_slipnet_name: slipnet-users.json
backup_dnstt_name: dnstt-server.key
backup_dnstt_pub_name: dnstt-server.pub
backup_xui_name: x-ui.db
backup_xui_path_name: xui-base-path
backup_rustdesk_key_name: rustdesk-id_ed25519
backup_rustdesk_pub_name: rustdesk-id_ed25519.pub
backup_reset_seed_name: slipstream-reset-seed

# Хранить ли прошлые снимки. Имя файла фиксированное, поэтому без этого каждый
# make backup затирает предыдущий — а пустой архив со свежего сервера затёр бы
# единственную копию ключей старого.
backup_keep_previous: true

# Шифровать ли скачанное на локальном ПК тем же vault, что и остальные секреты.
# Внутри — приватные ключи и пароли открытым текстом; кража ноутбука или
# синхронизация домашнего каталога в облако иначе отдают всю инфраструктуру.
backup_encrypt_local: true
