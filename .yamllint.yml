---
extends: default

ignore: |
  .venv/
  .ansible/
  trash/
  artifacts/
  # Зашифрованный vault — не YAML, а строка base64.
  vault.yaml

# Часть правил ниже — не вкусовщина, а требования ansible-lint: со своими
# значениями он ругается и отключает режим автоисправления.
rules:
  line-length:
    max: 120
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
